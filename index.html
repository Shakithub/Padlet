<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPadlet - กระดานโต้ตอบเรียนรู้ออนไลน์</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f1f5f9;
    }
    .masonry-grid {
      column-count: 1;
      column-gap: 1.5rem;
    }
    @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- Navbar -->
  <nav class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateHome()">
          <div class="bg-gradient-to-tr from-indigo-600 to-pink-500 text-white p-2.5 rounded-2xl shadow-md">
            <i class="fa-solid fa-layer-group text-xl"></i>
          </div>
          <span class="text-xl font-extrabold bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">EduPadlet</span>
        </div>

        <div id="userInfoBar" class="hidden flex items-center space-x-4">
          <div class="text-right hidden sm:block">
            <p id="navUserName" class="font-bold text-slate-700 text-sm leading-tight"></p>
            <span id="navUserRole" class="inline-block text-[10px] px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-600 font-semibold border border-indigo-100"></span>
          </div>
          <button onclick="logout()" class="text-slate-400 hover:text-red-600 p-2 rounded-xl hover:bg-slate-100 transition">
            <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Container หลัก -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <!-- 1. หน้าล็อกอิน / ลงทะเบียน -->
    <div id="authSection" class="max-w-md mx-auto my-10 bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">เข้าสู่ระบบ / ลงทะเบียน</h2>
        <p class="text-sm text-slate-500 mt-1">กระดานเรียนรู้และแบ่งปันไอเดีย</p>
      </div>

      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-indigo-600 border-b-2 border-indigo-600">เข้าสู่ระบบ</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 font-bold text-slate-400 hover:text-slate-600">ลงทะเบียน</button>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Username</label>
          <input type="text" id="loginUsername" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition">เข้าสู่ระบบ</button>
      </form>

      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">ชื่อ-นามสกุล</label>
          <input type="text" id="regFullname" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">สถานะ</label>
          <select id="regRole" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="student">นักเรียน / นักศึกษา</option>
            <option value="teacher">คุณครู / ผู้สอน</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Username</label>
          <input type="text" id="regUsername" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-pink-200 transition">สมัครสมาชิก</button>
      </form>
    </div>

    <!-- 2. หน้ารายวิชาทั้งหมด (Dashboard) -->
    <div id="dashboardSection" class="hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
        <div>
          <h1 id="dashboardTitle" class="text-2xl font-bold text-slate-800">รายวิชาทั้งหมด</h1>
          <p id="dashboardSub" class="text-sm text-slate-500 mt-1">เลือกวิชาเพื่อเข้าสู่กระดานโต้ตอบ</p>
        </div>
        
        <button id="addCourseBtn" onclick="openCreateCourseModal()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-2xl font-bold shadow-md flex items-center space-x-2 transition">
          <i class="fa-solid fa-plus"></i>
          <span>สร้างรายวิชาใหม่</span>
        </button>
      </div>

      <div id="coursesList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- 3. หน้ากระดาน Padlet -->
    <div id="boardSection" class="hidden">
      <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm mb-6">
        <div class="flex flex-wrap justify-between items-center gap-4">
          <div class="flex items-center space-x-3">
            <button onclick="navigateHome()" class="bg-slate-100 hover:bg-slate-200 p-3 rounded-2xl text-slate-600 transition">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div>
              <div class="flex items-center space-x-2">
                <h2 id="boardCourseName" class="text-2xl font-bold text-slate-800"></h2>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">
                  <span class="w-1.5 h-1.5 mr-1 bg-emerald-500 rounded-full animate-ping"></span> Realtime
                </span>
              </div>
              <p id="boardCourseDesc" class="text-slate-500 text-sm mt-0.5"></p>
            </div>
          </div>
          
          <div class="flex items-center space-x-3">
            <button onclick="showQRCodeModal()" class="bg-purple-50 hover:bg-purple-100 text-purple-700 px-4 py-2.5 rounded-2xl font-bold text-sm border border-purple-200 flex items-center space-x-2 transition">
              <i class="fa-solid fa-qrcode"></i>
              <span>QR Code</span>
            </button>
            <button onclick="openCreatePostModal()" class="bg-gradient-to-r from-indigo-600 to-pink-500 hover:opacity-95 text-white px-5 py-2.5 rounded-2xl font-bold text-sm shadow-md flex items-center space-x-2 transition">
              <i class="fa-solid fa-plus"></i>
              <span>สร้างโพสต์</span>
            </button>
          </div>
        </div>
      </div>

      <!-- กระดาน Masonry Grid -->
      <div id="postsContainer" class="masonry-grid"></div>
    </div>

  </main>

  <!-- Modal: สร้างโพสต์แบบ Padlet -->
  <div id="postModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative border border-slate-100">
      <button onclick="closePostModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center space-x-2">
        <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
        <span>สร้างโพสต์ใหม่</span>
      </h3>

      <textarea id="postContentInput" rows="3" placeholder="เขียนข้อความของคุณที่นี่..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm mb-4 resize-none"></textarea>

      <!-- แสดงพรีวิวของแนบก่อนโพสต์ -->
      <div id="attachmentPreview" class="mb-4 hidden"></div>

      <!-- แถบปุ่มเลือกแนบไฟล์แบบ Padlet -->
      <div class="border-t border-slate-100 pt-4 mb-6">
        <label class="block text-xs font-bold text-slate-400 uppercase mb-2">แนบสื่อเพิ่มเติม</label>
        <div class="grid grid-cols-3 gap-2">
          <!-- ปุ่มแนบรูปภาพ -->
          <button onclick="triggerImageUpload()" class="p-3 bg-pink-50 hover:bg-pink-100 text-pink-600 rounded-2xl text-xs font-bold flex flex-col items-center justify-center gap-1 transition">
            <i class="fa-solid fa-image text-lg"></i>
            <span>รูปภาพ</span>
          </button>
          <input type="file" id="imageFileInput" accept="image/*" class="hidden" onchange="handleImageSelected(event)">

          <!-- ปุ่มอัดเสียง -->
          <button id="voiceRecordBtn" onclick="toggleVoiceRecording()" class="p-3 bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-2xl text-xs font-bold flex flex-col items-center justify-center gap-1 transition">
            <i class="fa-solid fa-microphone text-lg" id="micIcon"></i>
            <span id="micText">อัดเสียง</span>
          </button>

          <!-- ปุ่มแนบลิงก์ -->
          <button onclick="promptLinkUrl()" class="p-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-2xl text-xs font-bold flex flex-col items-center justify-center gap-1 transition">
            <i class="fa-solid fa-link text-lg"></i>
            <span>ลิงก์เว็บ</span>
          </button>
        </div>
      </div>

      <button onclick="submitNewPost()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-200 transition">
        โพสต์ลงกระดาน
      </button>
    </div>
  </div>

  <!-- Modal: แสดง QR Code -->
  <div id="qrModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-3xl max-w-sm w-full text-center relative shadow-2xl">
      <button onclick="closeQRModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h3 class="text-lg font-bold text-slate-800 mb-1">สแกนเพื่อเข้าสู่วิชา</h3>
      <p id="qrCourseTitle" class="text-xs text-slate-500 mb-4"></p>
      <div id="qrcode" class="flex justify-center p-4 bg-slate-50 rounded-2xl border border-slate-100 mb-4"></div>
      <p class="text-xs text-slate-400">สแกนเพื่อเปิดบทเรียนและโพสต์โต้ตอบ</p>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNxQRAsrm2LFx0KsfX-oUaz8rUSya58R-BZTnUOQOt03YreyvPKT5DtEwWVk6e6xivBA/exec";

    let currentUser = null;
    let currentCourse = null;
    let pollInterval = null;

    // สถานะสิ่งแนบใน Post Modal
    let pendingAttachment = { type: 'none', url: '', base64: '', meta: {} };
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    window.onload = function() {
      checkStoredUser();
      checkURLParams();

      // ซ่อน Dropdown เมื่อคลิกที่อื่น
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.dropdown-container')) {
          document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden'));
        }
      });
    };

    function checkStoredUser() {
      const stored = localStorage.getItem('padlet_user');
      if (stored) {
        currentUser = JSON.parse(stored);
        updateUIForUser();
      } else {
        showSection('authSection');
      }
    }

    function checkURLParams() {
      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('courseId');
      if (courseId && currentUser) {
        joinAndOpenCourse(courseId);
      }
    }

    function stopPolling() {
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    }

    function startPolling() {
      stopPolling();
      pollInterval = setInterval(() => {
        if (currentCourse) loadPosts(true);
      }, 5000);
    }

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('tabLoginBtn').className = "flex-1 py-2 font-bold text-indigo-600 border-b-2 border-indigo-600";
        document.getElementById('tabRegisterBtn').className = "flex-1 py-2 font-bold text-slate-400 hover:text-slate-600";
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('tabRegisterBtn').className = "flex-1 py-2 font-bold text-pink-600 border-b-2 border-pink-600";
        document.getElementById('tabLoginBtn').className = "flex-1 py-2 font-bold text-slate-400 hover:text-slate-600";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      Swal.showLoading();
      const res = await apiCall({ 
        action: 'login', 
        username: document.getElementById('loginUsername').value, 
        password: document.getElementById('loginPassword').value 
      });
      Swal.close();

      if (res.success) {
        currentUser = res.user;
        localStorage.setItem('padlet_user', JSON.stringify(currentUser));
        updateUIForUser();
      } else {
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message });
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      Swal.showLoading();
      const res = await apiCall({ 
        action: 'register', 
        fullname: document.getElementById('regFullname').value, 
        role: document.getElementById('regRole').value, 
        username: document.getElementById('regUsername').value, 
        password: document.getElementById('regPassword').value 
      });
      Swal.close();

      if (res.success) {
        currentUser = res.user;
        localStorage.setItem('padlet_user', JSON.stringify(currentUser));
        updateUIForUser();
      } else {
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message });
      }
    }

    function logout() {
      stopPolling();
      localStorage.removeItem('padlet_user');
      currentUser = null;
      currentCourse = null;
      document.getElementById('userInfoBar').classList.add('hidden');
      showSection('authSection');
    }

    function updateUIForUser() {
      document.getElementById('navUserName').innerText = currentUser.fullname;
      document.getElementById('navUserRole').innerText = currentUser.role === 'teacher' ? 'คุณครู' : 'นักเรียน';
      document.getElementById('userInfoBar').classList.remove('hidden');

      if (currentUser.role === 'teacher') {
        document.getElementById('addCourseBtn').classList.remove('hidden');
        document.getElementById('dashboardTitle').innerText = 'รายวิชาที่คุณสร้างขึ้น';
      } else {
        document.getElementById('addCourseBtn').classList.add('hidden');
        document.getElementById('dashboardTitle').innerText = 'รายวิชาที่ฉันเข้าร่วม';
      }

      loadCourses();
    }

    async function apiCall(payload) {
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (err) {
        return { success: false, message: 'การเชื่อมต่อขัดข้อง' };
      }
    }

    async function loadCourses() {
      stopPolling();
      showSection('dashboardSection');
      const coursesList = document.getElementById('coursesList');
      coursesList.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">กำลังโหลดวิชา...</p></div>`;

      const res = await apiCall({ action: 'getCourses', userId: currentUser.userId, role: currentUser.role });

      if (res.success && res.courses.length > 0) {
        coursesList.innerHTML = res.courses.map(c => `
          <div onclick="openCourse('${c.courseId}')" class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
            <div>
              <div class="flex justify-between items-start mb-3">
                <span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-xl font-bold border border-indigo-100">${c.courseId}</span>
                <i class="fa-solid fa-arrow-right text-slate-300 group-hover:text-indigo-600 transition"></i>
              </div>
              <h3 class="text-lg font-bold text-slate-800 mb-2">${c.courseName}</h3>
              <p class="text-slate-500 text-sm line-clamp-2">${c.description || 'ไม่มีคำอธิบาย'}</p>
            </div>
            <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400">
              <i class="fa-solid fa-user-tie mr-1"></i> ${c.teacherName}
            </div>
          </div>
        `).join('');
      } else {
        coursesList.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-3xl border border-dashed border-slate-300 text-slate-400">ยังไม่มีรายวิชา</div>`;
      }
    }

    async function openCreateCourseModal() {
      const { value: formValues } = await Swal.fire({
        title: 'สร้างรายวิชาใหม่',
        html: `
          <input id="swalCourseName" class="swal2-input" placeholder="ชื่อวิชา">
          <textarea id="swalCourseDesc" class="swal2-textarea" placeholder="คำอธิบายวิชา..."></textarea>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'สร้างวิชา',
        confirmButtonColor: '#4f46e5',
        preConfirm: () => [
          document.getElementById('swalCourseName').value,
          document.getElementById('swalCourseDesc').value
        ]
      });

      if (formValues && formValues[0]) {
        Swal.showLoading();
        await apiCall({
          action: 'createCourse',
          courseName: formValues[0],
          description: formValues[1],
          userId: currentUser.userId,
          userName: currentUser.fullname
        });
        Swal.close();
        loadCourses();
      }
    }

    async function joinAndOpenCourse(courseId) {
      await apiCall({ action: 'joinCourse', userId: currentUser.userId, courseId: courseId });
      openCourse(courseId);
    }

    async function openCourse(courseId) {
      Swal.showLoading();
      const res = await apiCall({ action: 'getCourseDetails', courseId: courseId });
      Swal.close();

      if (res.success) {
        currentCourse = res.course;
        document.getElementById('boardCourseName').innerText = currentCourse.courseName;
        document.getElementById('boardCourseDesc').innerText = currentCourse.description;
        showSection('boardSection');
        
        await loadPosts();
        startPolling();
      }
    }

    // --- Load Posts & Render Rich Media ---
    async function loadPosts(isSilent = false) {
      if (isSilent && document.activeElement && document.activeElement.tagName === 'INPUT') return;

      const postsContainer = document.getElementById('postsContainer');
      if (!isSilent) {
        postsContainer.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">กำลังโหลดโพสต์...</p></div>`;
      }

      const res = await apiCall({ action: 'getPosts', courseId: currentCourse.courseId });

      if (res.success && res.posts.length > 0) {
        postsContainer.innerHTML = res.posts.map(post => {
          const isMyPost = post.authorId === currentUser.userId;

          return `
            <div class="masonry-item bg-white p-5 rounded-3xl border border-slate-200 shadow-sm hover:shadow-md transition relative">
              
              <!-- Header การ์ดโพสต์ -->
              <div class="flex justify-between items-start mb-3">
                <div class="flex items-center space-x-2.5">
                  <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
                    ${post.authorName ? post.authorName.charAt(0) : 'U'}
                  </div>
                  <div>
                    <h4 class="text-sm font-bold text-slate-800 leading-tight">${post.authorName}</h4>
                    <span class="text-[10px] text-slate-400">${new Date(post.createdAt).toLocaleDateString('th-TH')}</span>
                  </div>
                </div>

                <div class="flex items-center space-x-2">
                  <span class="text-[10px] px-2.5 py-0.5 rounded-full ${post.role === 'teacher' ? 'bg-purple-100 text-purple-700 font-bold' : 'bg-slate-100 text-slate-600'}">${post.role === 'teacher' ? 'ผู้สอน' : 'นักเรียน'}</span>
                  
                  <!-- ปุ่มสามจุด (...) แสดงเฉพาะของตัวเองเท่านั้น -->
                  ${isMyPost ? `
                    <div class="relative dropdown-container">
                      <button onclick="toggleDropdown('dropdown-post-${post.postId}')" class="w-7 h-7 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center transition">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                      </button>
                      <div id="dropdown-post-${post.postId}" class="dropdown-menu hidden absolute right-0 top-8 w-32 bg-white rounded-2xl shadow-xl border border-slate-100 z-20 py-1.5">
                        <button onclick="openEditPostModal('${post.postId}', \`${post.content.replace(/`/g, '\\`')}\`)" class="w-full text-left px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 flex items-center space-x-2">
                          <i class="fa-solid fa-pen text-indigo-500"></i>
                          <span>แก้ไข</span>
                        </button>
                        <button onclick="confirmDeletePost('${post.postId}')" class="w-full text-left px-4 py-2 text-xs font-semibold text-red-600 hover:bg-red-50 flex items-center space-x-2">
                          <i class="fa-solid fa-trash-can"></i>
                          <span>ลบ</span>
                        </button>
                      </div>
                    </div>
                  ` : ''}
                </div>
              </div>

              <!-- ข้อความโพสต์ -->
              ${post.content ? `<p class="text-slate-700 text-sm whitespace-pre-line mb-3">${post.content}</p>` : ''}

              <!-- แสดงสื่อแนบ (รูปภาพ/เสียง/ลิงก์) -->
              ${renderAttachment(post.attachType, post.attachUrl, post.attachMeta)}

              <!-- ส่วนความคิดเห็น -->
              <div class="border-t border-slate-100 pt-3 mt-4">
                <div class="space-y-2 mb-3 max-h-44 overflow-y-auto pr-1">
                  ${post.comments.map(c => {
                    const isMyComment = c.authorId === currentUser.userId;
                    return `
                      <div class="bg-slate-50 p-3 rounded-2xl text-xs flex justify-between items-start group">
                        <div class="flex-1 pr-2">
                          <span class="font-bold text-slate-800 mr-1">${c.authorName}:</span>
                          <span class="text-slate-600">${c.content}</span>
                        </div>
                        
                        <!-- ปุ่มสามจุด (...) คอมเมนต์ เฉพาะของตัวเอง -->
                        ${isMyComment ? `
                          <div class="relative dropdown-container">
                            <button onclick="toggleDropdown('dropdown-cmt-${c.commentId}')" class="w-5 h-5 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-600 flex items-center justify-center">
                              <i class="fa-solid fa-ellipsis text-[10px]"></i>
                            </button>
                            <div id="dropdown-cmt-${c.commentId}" class="dropdown-menu hidden absolute right-0 top-6 w-28 bg-white rounded-xl shadow-lg border border-slate-100 z-20 py-1">
                              <button onclick="openEditCommentModal('${c.commentId}', \`${c.content.replace(/`/g, '\\`')}\`)" class="w-full text-left px-3 py-1.5 text-[11px] font-semibold text-slate-700 hover:bg-indigo-50">แก้ไข</button>
                              <button onclick="confirmDeleteComment('${c.commentId}')" class="w-full text-left px-3 py-1.5 text-[11px] font-semibold text-red-600 hover:bg-red-50">ลบ</button>
                            </div>
                          </div>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- ช่องพิมพ์คอมเมนต์ -->
                <div class="flex gap-2">
                  <input type="text" id="comment-input-${post.postId}" placeholder="พิมพ์ความคิดเห็น..." class="flex-1 bg-slate-50 px-3.5 py-2 rounded-xl border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none">
                  <button onclick="submitComment('${post.postId}')" class="bg-indigo-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold hover:bg-indigo-700 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                  </button>
                </div>
              </div>

            </div>
          `;
        }).join('');
      } else {
        postsContainer.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-3xl border border-dashed border-slate-300 text-slate-400">ยังไม่มีโพสต์ในกระดานนี้</div>`;
      }
    }

    // Helper: Render สื่อชนิดต่างๆ
    function renderAttachment(type, url, metaRaw) {
      if (!type || type === 'none' || !url) return '';

      let meta = {};
      try { meta = typeof metaRaw === 'string' ? JSON.parse(metaRaw) : (metaRaw || {}); } catch(e){}

      if (type === 'image') {
        return `
          <div class="my-3 rounded-2xl overflow-hidden border border-slate-100 shadow-sm bg-slate-900">
            <img src="${url}" class="w-full h-auto max-h-80 object-cover hover:scale-105 transition duration-300 cursor-pointer" onclick="window.open('${url}', '_blank')">
          </div>
        `;
      } else if (type === 'audio') {
        return `
          <div class="my-3 p-3 bg-purple-50 rounded-2xl border border-purple-100 flex flex-col gap-2">
            <div class="flex items-center space-x-2 text-xs font-bold text-purple-700">
              <i class="fa-solid fa-file-audio"></i>
              <span>ข้อความเสียง</span>
            </div>
            <audio controls class="w-full h-8">
              <source src="${url}">
            </audio>
          </div>
        `;
      } else if (type === 'link') {
        const domain = meta.domain || new URL(url).hostname;
        return `
          <a href="${url}" target="_blank" class="my-3 p-3 bg-indigo-50/70 hover:bg-indigo-100/70 border border-indigo-100 rounded-2xl flex items-center space-x-3 transition group block">
            <div class="w-10 h-10 rounded-xl bg-white text-indigo-600 flex items-center justify-center font-bold text-lg shadow-sm border border-slate-100">
              <i class="fa-solid fa-globe"></i>
            </div>
            <div class="flex-1 overflow-hidden">
              <h5 class="text-xs font-bold text-indigo-900 truncate group-hover:underline">${meta.title || url}</h5>
              <p class="text-[10px] text-slate-400 truncate">${domain}</p>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square text-xs text-indigo-400 group-hover:text-indigo-600"></i>
          </a>
        `;
      }
      return '';
    }

    // --- Dropdown Menu Toggle ---
    function toggleDropdown(id) {
      document.querySelectorAll('.dropdown-menu').forEach(m => {
        if (m.id !== id) m.classList.add('hidden');
      });
      const menu = document.getElementById(id);
      if (menu) menu.classList.toggle('hidden');
    }

    // --- Post Attachment Modal Handling ---
    function openCreatePostModal() {
      resetAttachment();
      document.getElementById('postContentInput').value = '';
      document.getElementById('postModal').classList.remove('hidden');
    }

    function closePostModal() {
      if (isRecording) stopRecording();
      document.getElementById('postModal').classList.add('hidden');
    }

    function resetAttachment() {
      pendingAttachment = { type: 'none', url: '', base64: '', meta: {} };
      const preview = document.getElementById('attachmentPreview');
      preview.innerHTML = '';
      preview.classList.add('hidden');
    }

    // 1. แนบรูปภาพ
    function triggerImageUpload() {
      document.getElementById('imageFileInput').click();
    }

    function handleImageSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        pendingAttachment = {
          type: 'image',
          base64: e.target.result,
          fileName: file.name,
          mimeType: file.type
        };
        
        showPreview(`
          <div class="relative rounded-2xl overflow-hidden border border-slate-200 max-h-48 bg-slate-100">
            <img src="${e.target.result}" class="w-full h-36 object-cover">
            <button onclick="resetAttachment()" class="absolute top-2 right-2 bg-slate-900/70 text-white rounded-full p-1.5 hover:bg-red-600 transition">
              <i class="fa-solid fa-xmark text-xs"></i>
            </button>
          </div>
        `);
      };
      reader.readAsDataURL(file);
    }

    // 2. อัดเสียงสด
    async function toggleVoiceRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              pendingAttachment = {
                type: 'audio',
                base64: reader.result,
                fileName: 'voice_' + Date.now() + '.webm',
                mimeType: 'audio/webm'
              };
              showPreview(`
                <div class="p-3 bg-purple-50 rounded-2xl border border-purple-200 flex justify-between items-center">
                  <div class="flex items-center space-x-2 text-purple-700 text-xs font-bold">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>บันทึกเสียงเรียบร้อยแล้ว</span>
                  </div>
                  <button onclick="resetAttachment()" class="text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash-can"></i></button>
                </div>
              `);
            };
            reader.readAsDataURL(audioBlob);
          };

          mediaRecorder.start();
          isRecording = true;
          document.getElementById('micIcon').className = "fa-solid fa-stop text-lg text-red-500 animate-pulse";
          document.getElementById('micText').innerText = "กำลังอัด...";
        } catch (err) {
          Swal.fire({ icon: 'error', title: 'ไม่สามารถเปิดไมโครโฟนได้', text: 'กรุณนอนุญาตสิทธิ์การใช้ไมโครโฟน' });
        }
      } else {
        stopRecording();
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        document.getElementById('micIcon').className = "fa-solid fa-microphone text-lg";
        document.getElementById('micText').innerText = "อัดเสียง";
      }
    }

    // 3. แนบลิงก์
    async function promptLinkUrl() {
      const { value: url } = await Swal.fire({
        title: 'ใส่ URL ลิงก์เว็บ',
        input: 'url',
        inputPlaceholder: 'https://example.com',
        showCancelButton: true,
        confirmButtonText: 'ตกลง',
        confirmButtonColor: '#4f46e5'
      });

      if (url) {
        pendingAttachment = {
          type: 'link',
          url: url,
          meta: { title: url, domain: new URL(url).hostname }
        };

        showPreview(`
          <div class="p-3 bg-indigo-50 rounded-2xl border border-indigo-200 flex justify-between items-center">
            <div class="flex items-center space-x-2 text-indigo-700 text-xs font-bold truncate">
              <i class="fa-solid fa-link"></i>
              <span class="truncate">${url}</span>
            </div>
            <button onclick="resetAttachment()" class="text-slate-400 hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `);
      }
    }

    function showPreview(html) {
      const preview = document.getElementById('attachmentPreview');
      preview.innerHTML = html;
      preview.classList.remove('hidden');
    }

    // ส่งโพสต์ไปยังระบบหลังบ้าน
    async function submitNewPost() {
      const content = document.getElementById('postContentInput').value.trim();
      if (!content && pendingAttachment.type === 'none') {
        Swal.fire({ icon: 'warning', title: 'กรุณากรอกข้อความหรือแนบสื่ออย่างน้อย 1 อย่าง' });
        return;
      }

      closePostModal();
      Swal.showLoading();

      const payload = {
        action: 'createPost',
        courseId: currentCourse.courseId,
        userId: currentUser.userId,
        userName: currentUser.fullname,
        role: currentUser.role,
        content: content,
        attachType: pendingAttachment.type,
        attachUrl: pendingAttachment.url || '',
        fileBase64: pendingAttachment.base64 || '',
        fileName: pendingAttachment.fileName || '',
        mimeType: pendingAttachment.mimeType || '',
        attachMeta: pendingAttachment.meta || {}
      };

      const res = await apiCall(payload);
      Swal.close();

      if (res.success) {
        loadPosts();
      } else {
        Swal.fire({ icon: 'error', title: 'โพสต์ไม่สำเร็จ', text: res.message });
      }
    }

    // --- Action Handlers (Edit/Delete) ---
    async function openEditPostModal(postId, currentContent) {
      const { value: newContent } = await Swal.fire({
        title: 'แก้ไขข้อความโพสต์',
        input: 'textarea',
        inputValue: currentContent,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        confirmButtonColor: '#4f46e5'
      });

      if (newContent !== undefined && newContent !== currentContent) {
        Swal.showLoading();
        const res = await apiCall({ action: 'editPost', postId, userId: currentUser.userId, content: newContent });
        Swal.close();
        if (res.success) loadPosts();
      }
    }

    async function confirmDeletePost(postId) {
      const result = await Swal.fire({
        title: 'ยืนยันลบโพสต์?',
        text: 'ความคิดเห็นทั้งหมดในโพสต์นี้จะถูกลบไปด้วย',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'ลบโพสต์'
      });

      if (result.isConfirmed) {
        Swal.showLoading();
        const res = await apiCall({ action: 'deletePost', postId, userId: currentUser.userId });
        Swal.close();
        if (res.success) loadPosts();
      }
    }

    async function openEditCommentModal(commentId, currentContent) {
      const { value: newContent } = await Swal.fire({
        title: 'แก้ไขความคิดเห็น',
        input: 'text',
        inputValue: currentContent,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        confirmButtonColor: '#4f46e5'
      });

      if (newContent !== undefined && newContent !== currentContent) {
        Swal.showLoading();
        const res = await apiCall({ action: 'editComment', commentId, userId: currentUser.userId, content: newContent });
        Swal.close();
        if (res.success) loadPosts();
      }
    }

    async function confirmDeleteComment(commentId) {
      const result = await Swal.fire({
        title: 'ยืนยันลบความคิดเห็น?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'ลบ'
      });

      if (result.isConfirmed) {
        Swal.showLoading();
        const res = await apiCall({ action: 'deleteComment', commentId, userId: currentUser.userId });
        Swal.close();
        if (res.success) loadPosts();
      }
    }

    async function submitComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      input.value = '';
      await apiCall({
        action: 'addComment',
        postId: postId,
        userId: currentUser.userId,
        userName: currentUser.fullname,
        content: content
      });

      loadPosts();
    }

    function showQRCodeModal() {
      document.getElementById('qrCourseTitle').innerText = currentCourse.courseName;
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      new QRCode(container, {
        text: `${window.location.origin}${window.location.pathname}?courseId=${currentCourse.courseId}`,
        width: 180,
        height: 180
      });
      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    function showSection(sectionId) {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('boardSection').classList.add('hidden');
      document.getElementById(sectionId).classList.remove('hidden');
    }

    function navigateHome() {
      stopPolling();
      if (currentUser) {
        currentCourse = null;
        loadCourses();
      } else {
        showSection('authSection');
      }
    }
  </script>
</body>
</html>
