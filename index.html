<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPadlet - ห้องเรียนโต้ตอบออนไลน์</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f8fafc;
    }
    .masonry-grid {
      column-count: 1;
      column-gap: 1.5rem;
    }
    @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- Navbar -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateHome()">
          <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
            <i class="fa-solid fa-shapes text-xl"></i>
          </div>
          <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">EduPadlet</span>
        </div>

        <!-- User Profile Info -->
        <div id="userInfoBar" class="hidden flex items-center space-x-4">
          <div class="text-right hidden sm:block">
            <p id="navUserName" class="font-semibold text-slate-700 text-sm leading-tight"></p>
            <span id="navUserRole" class="inline-block text-[10px] px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-medium"></span>
          </div>
          <button onclick="logout()" class="text-slate-500 hover:text-red-600 p-2 rounded-lg hover:bg-slate-100 transition" title="ออกจากระบบ">
            <i class="fa-solid fa-right-from-bracket text-lg"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Container หลัก -->
  <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <!-- 1. หน้าล็อกอิน / ลงทะเบียน -->
    <div id="authSection" class="max-w-md mx-auto my-10 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">เข้าสู่ระบบ / ลงทะเบียน</h2>
        <p class="text-sm text-slate-500 mt-1">เข้าสู่พื้นที่แลกเปลี่ยนเรียนรู้ออนไลน์</p>
      </div>

      <!-- Tab Switcher -->
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600">เข้าสู่ระบบ</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600">ลงทะเบียน</button>
      </div>

      <!-- ฟอร์มเข้าสู่ระบบ -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อผู้ใช้งาน (Username)</label>
          <input type="text" id="loginUsername" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">รหัสผ่าน</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-200 transition">เข้าสู่ระบบ</button>
      </form>

      <!-- ฟอร์มลงทะเบียน -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อ-นามสกุล</label>
          <input type="text" id="regFullname" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ประเภทผู้ใช้งาน</label>
          <select id="regRole" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="student">นักเรียน / นักศึกษา</option>
            <option value="teacher">คุณครู / ผู้สอน</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อผู้ใช้งาน (Username)</label>
          <input type="text" id="regUsername" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">รหัสผ่าน</label>
          <input type="password" id="regPassword" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-purple-200 transition">สมัครสมาชิก</button>
      </form>
    </div>

    <!-- 2. หน้ารายวิชาทั้งหมด (Dashboard) -->
    <div id="dashboardSection" class="hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
        <div>
          <h1 id="dashboardTitle" class="text-2xl font-bold text-slate-800">รายวิชาทั้งหมด</h1>
          <p id="dashboardSub" class="text-sm text-slate-500 mt-1">เลือกรายวิชาเพื่อเข้าสู่บอร์ดโต้ตอบ</p>
        </div>
        
        <button id="addCourseBtn" onclick="openCreateCourseModal()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-md flex items-center space-x-2 transition">
          <i class="fa-solid fa-plus"></i>
          <span>สร้างรายวิชาใหม่</span>
        </button>
      </div>

      <!-- รายการการ์ดวิชา -->
      <div id="coursesList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- 3. หน้ากระดานโต้ตอบรายวิชา (Padlet Board View) -->
    <div id="boardSection" class="hidden">
      <!-- Header วิชา -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6">
        <div class="flex flex-wrap justify-between items-center gap-4">
          <div class="flex items-center space-x-3">
            <button onclick="navigateHome()" class="bg-slate-100 hover:bg-slate-200 p-2.5 rounded-xl text-slate-600 transition" title="กลับหน้ารวมวิชา">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
              <div class="flex items-center space-x-2">
                <h2 id="boardCourseName" class="text-2xl font-bold text-slate-800"></h2>
                <span id="realtimeBadge" class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-emerald-100 text-emerald-800">
                  <span class="w-1.5 h-1.5 mr-1 bg-emerald-500 rounded-full animate-ping"></span> Realtime
                </span>
              </div>
              <p id="boardCourseDesc" class="text-slate-500 text-sm mt-0.5"></p>
            </div>
          </div>
          
          <div class="flex items-center space-x-3">
            <button onclick="showQRCodeModal()" class="bg-purple-50 hover:bg-purple-100 text-purple-700 px-4 py-2 rounded-xl font-medium text-sm border border-purple-200 flex items-center space-x-2 transition">
              <i class="fa-solid fa-qrcode text-base"></i>
              <span>QR Code วิชา</span>
            </button>
            <button onclick="openCreatePostModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-medium text-sm shadow flex items-center space-x-2 transition">
              <i class="fa-solid fa-pen"></i>
              <span>โพสต์ข้อความ</span>
            </button>
          </div>
        </div>
      </div>

      <!-- กระดานโพสต์แบบ Masonry Grid -->
      <div id="postsContainer" class="masonry-grid"></div>
    </div>

  </main>

  <!-- Modal: แสดง QR Code -->
  <div id="qrModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white p-6 rounded-2xl max-w-sm w-full text-center relative shadow-2xl">
      <button onclick="closeQRModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h3 class="text-lg font-bold text-slate-800 mb-1">สแกนเพื่อเข้าสู่วิชา</h3>
      <p id="qrCourseTitle" class="text-xs text-slate-500 mb-4"></p>
      <div id="qrcode" class="flex justify-center p-4 bg-slate-50 rounded-xl border border-slate-100 mb-4"></div>
      <p class="text-xs text-slate-400">นักเรียนสามารถสแกน QR Code นี้เพื่อเข้าร่วมกระดานโต้ตอบได้ทันที</p>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNxQRAsrm2LFx0KsfX-oUaz8rUSya58R-BZTnUOQOt03YreyvPKT5DtEwWVk6e6xivBA/exec";

    let currentUser = null;
    let currentCourse = null;
    let pollInterval = null; // ตัวแปรเก็บ Timer สำหรับ Realtime Polling

    window.onload = function() {
      checkStoredUser();
      checkURLParams();
    };

    function checkStoredUser() {
      const stored = localStorage.getItem('padlet_user');
      if (stored) {
        currentUser = JSON.parse(stored);
        updateUIForUser();
      } else {
        showSection('authSection');
      }
    }

    function checkURLParams() {
      const urlParams = new URLSearchParams(window.location.search);
      const courseId = urlParams.get('courseId');
      
      if (courseId) {
        if (!currentUser) {
          Swal.fire({
            icon: 'info',
            title: 'กรุณาเข้าสู่ระบบก่อน',
            text: 'กรุณาลงทะเบียนหรือเข้าสู่ระบบเพื่อเข้าสู่รายวิชานี้',
            confirmButtonColor: '#4f46e5'
          });
        } else {
          joinAndOpenCourse(courseId);
        }
      }
    }

    function stopPolling() {
      if (pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }

    function startPolling() {
      stopPolling();
      // ดึงข้อมูลใหม่ทุกๆ 5 วินาที
      pollInterval = setInterval(() => {
        if (currentCourse) {
          loadPosts(true); // silent fetch
        }
      }, 5000);
    }

    // --- Authentication Logic ---
    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('tabLoginBtn').className = "flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600";
        document.getElementById('tabRegisterBtn').className = "flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600";
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('tabRegisterBtn').className = "flex-1 py-2 font-semibold text-purple-600 border-b-2 border-purple-600";
        document.getElementById('tabLoginBtn').className = "flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      Swal.showLoading();
      const res = await apiCall({ action: 'login', username, password });
      Swal.close();

      if (res.success) {
        currentUser = res.user;
        localStorage.setItem('padlet_user', JSON.stringify(currentUser));
        updateUIForUser();
        Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', timer: 1200, showConfirmButton: false });
      } else {
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message, confirmButtonColor: '#4f46e5' });
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullname = document.getElementById('regFullname').value;
      const role = document.getElementById('regRole').value;
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;

      Swal.showLoading();
      const res = await apiCall({ action: 'register', fullname, role, username, password });
      Swal.close();

      if (res.success) {
        currentUser = res.user;
        localStorage.setItem('padlet_user', JSON.stringify(currentUser));
        updateUIForUser();
        Swal.fire({ icon: 'success', title: 'ลงทะเบียนสำเร็จ', timer: 1200, showConfirmButton: false });
      } else {
        Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message, confirmButtonColor: '#4f46e5' });
      }
    }

    function logout() {
      stopPolling();
      localStorage.removeItem('padlet_user');
      currentUser = null;
      currentCourse = null;
      document.getElementById('userInfoBar').classList.add('hidden');
      showSection('authSection');
    }

    function updateUIForUser() {
      document.getElementById('navUserName').innerText = currentUser.fullname;
      document.getElementById('navUserRole').innerText = currentUser.role === 'teacher' ? 'คุณครู' : 'นักเรียน';
      document.getElementById('userInfoBar').classList.remove('hidden');

      if (currentUser.role === 'teacher') {
        document.getElementById('addCourseBtn').classList.remove('hidden');
        document.getElementById('dashboardTitle').innerText = 'รายวิชาที่คุณสร้างขึ้น';
      } else {
        document.getElementById('addCourseBtn').classList.add('hidden');
        document.getElementById('dashboardTitle').innerText = 'รายวิชาที่ฉันเข้าร่วม';
      }

      loadCourses();
    }

    // --- API Request Function ---
    async function apiCall(payload) {
      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        return await response.json();
      } catch (err) {
        console.error(err);
        return { success: false, message: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้' };
      }
    }

    // --- Dashboard & Course Actions ---
    async function loadCourses() {
      stopPolling();
      showSection('dashboardSection');
      const coursesList = document.getElementById('coursesList');
      coursesList.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">กำลังโหลดรายวิชา...</p></div>`;

      const res = await apiCall({ action: 'getCourses', userId: currentUser.userId, role: currentUser.role });

      if (res.success && res.courses.length > 0) {
        coursesList.innerHTML = res.courses.map(c => `
          <div onclick="openCourse('${c.courseId}')" class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
            <div>
              <div class="flex justify-between items-start mb-3">
                <span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-lg font-semibold border border-indigo-100">${c.courseId}</span>
                <i class="fa-solid fa-arrow-right text-slate-300 group-hover:text-indigo-600 transition"></i>
              </div>
              <h3 class="text-lg font-bold text-slate-800 mb-2">${c.courseName}</h3>
              <p class="text-slate-500 text-sm line-clamp-2">${c.description || 'ไม่มีคำอธิบาย'}</p>
            </div>
            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <span><i class="fa-solid fa-user-tie mr-1"></i> ${c.teacherName}</span>
            </div>
          </div>
        `).join('');
      } else {
        coursesList.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-400">ยังไม่มีรายวิชาในขณะนี้</div>`;
      }
    }

    async function openCreateCourseModal() {
      const { value: formValues } = await Swal.fire({
        title: 'สร้างรายวิชาใหม่',
        html: `
          <input id="swalCourseName" class="swal2-input" placeholder="ชื่อรายวิชา (เช่น วิทยาการคำนวณ)">
          <textarea id="swalCourseDesc" class="swal2-textarea" placeholder="คำอธิบายรายวิชา..."></textarea>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'สร้างวิชา',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#4f46e5',
        preConfirm: () => {
          return [
            document.getElementById('swalCourseName').value,
            document.getElementById('swalCourseDesc').value
          ]
        }
      });

      if (formValues && formValues[0]) {
        Swal.showLoading();
        const res = await apiCall({
          action: 'createCourse',
          courseName: formValues[0],
          description: formValues[1],
          userId: currentUser.userId,
          userName: currentUser.fullname
        });
        Swal.close();

        if (res.success) {
          Swal.fire({ icon: 'success', title: 'สร้างรายวิชาเรียบร้อยแล้ว', timer: 1200, showConfirmButton: false });
          loadCourses();
        }
      }
    }

    async function joinAndOpenCourse(courseId) {
      await apiCall({ action: 'joinCourse', userId: currentUser.userId, courseId: courseId });
      openCourse(courseId);
    }

    async function openCourse(courseId) {
      Swal.showLoading();
      const res = await apiCall({ action: 'getCourseDetails', courseId: courseId });
      Swal.close();

      if (res.success) {
        currentCourse = res.course;
        document.getElementById('boardCourseName').innerText = currentCourse.courseName;
        document.getElementById('boardCourseDesc').innerText = currentCourse.description;
        showSection('boardSection');
        
        await loadPosts();
        startPolling(); // เริ่มการดึงข้อมูล Realtime เมื่อเข้าสู่ห้องเรียน
      } else {
        Swal.fire({ icon: 'error', title: 'ไม่พบรายวิชา', text: res.message });
      }
    }

    // --- Padlet Board & Post Actions ---
    async function loadPosts(isSilent = false) {
      // หากผู้ใช้กำลังพิมพ์ช่องคอมเมนต์อยู่ จะไม่รีเฟรช DOM เพื่อป้องกันไม่ให้พิมพ์สะดุด
      if (isSilent && document.activeElement && document.activeElement.tagName === 'INPUT') {
        return;
      }

      const postsContainer = document.getElementById('postsContainer');
      if (!isSilent) {
        postsContainer.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2">กำลังโหลดโพสต์...</p></div>`;
      }

      const res = await apiCall({ action: 'getPosts', courseId: currentCourse.courseId });

      if (res.success && res.posts.length > 0) {
        postsContainer.innerHTML = res.posts.map(post => {
          const isMyPost = post.authorId === currentUser.userId;

          return `
            <div class="masonry-item bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
              <div class="flex justify-between items-start mb-3">
                <div class="flex items-center space-x-2">
                  <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xs">
                    ${post.authorName ? post.authorName.charAt(0) : 'U'}
                  </div>
                  <div>
                    <h4 class="text-sm font-semibold text-slate-800">${post.authorName}</h4>
                    <span class="text-[10px] text-slate-400">${new Date(post.createdAt).toLocaleDateString('th-TH')}</span>
                  </div>
                </div>

                <div class="flex items-center space-x-2">
                  <span class="text-[10px] px-2 py-0.5 rounded-full ${post.role === 'teacher' ? 'bg-purple-100 text-purple-700 font-semibold' : 'bg-slate-100 text-slate-600'}">${post.role === 'teacher' ? 'ผู้สอน' : 'นักเรียน'}</span>
                  
                  <!-- ปุ่มแก้ไข/ลบโพสต์ (แสดงเฉพาะของตัวเอง) -->
                  ${isMyPost ? `
                    <div class="flex items-center space-x-1 ml-1 text-slate-400">
                      <button onclick="openEditPostModal('${post.postId}', \`${post.content.replace(/`/g, '\\`')}\`)" class="hover:text-indigo-600 p-1" title="แก้ไขโพสต์">
                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                      </button>
                      <button onclick="confirmDeletePost('${post.postId}')" class="hover:text-red-600 p-1" title="ลบโพสต์">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                      </button>
                    </div>
                  ` : ''}
                </div>
              </div>

              <p class="text-slate-700 text-sm whitespace-pre-line mb-4">${post.content}</p>

              <!-- Comments Section -->
              <div class="border-t border-slate-100 pt-3 mt-3">
                <div class="space-y-2 mb-3 max-h-40 overflow-y-auto pr-1">
                  ${post.comments.map(c => {
                    const isMyComment = c.authorId === currentUser.userId;
                    return `
                      <div class="bg-slate-50 p-2.5 rounded-xl text-xs flex justify-between items-start group">
                        <div>
                          <span class="font-semibold text-slate-700 mr-1">${c.authorName}:</span>
                          <span class="text-slate-600">${c.content}</span>
                        </div>
                        
                        <!-- ปุ่มแก้ไข/ลบคอมเมนต์ (แสดงเฉพาะของตัวเอง) -->
                        ${isMyComment ? `
                          <div class="flex items-center space-x-1 text-slate-400 ml-2 opacity-80 group-hover:opacity-100">
                            <button onclick="openEditCommentModal('${c.commentId}', \`${c.content.replace(/`/g, '\\`')}\`)" class="hover:text-indigo-600 p-0.5" title="แก้ไขความคิดเห็น">
                              <i class="fa-solid fa-pen text-[10px]"></i>
                            </button>
                            <button onclick="confirmDeleteComment('${c.commentId}')" class="hover:text-red-600 p-0.5" title="ลบความคิดเห็น">
                              <i class="fa-solid fa-trash-can text-[10px]"></i>
                            </button>
                          </div>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- Comment Input -->
                <div class="flex gap-2">
                  <input type="text" id="comment-input-${post.postId}" placeholder="เขียนความคิดเห็น..." class="flex-1 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200 text-xs focus:ring-1 focus:ring-indigo-500 outline-none">
                  <button onclick="submitComment('${post.postId}')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-medium hover:bg-indigo-700 transition">
                    <i class="fa-solid fa-paper-plane"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        postsContainer.innerHTML = `<div class="col-span-full text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-400">ยังไม่มีโพสต์ในกระดานนี้ เริ่มสร้างโพสต์แรกเลย!</div>`;
      }
    }

    async function openCreatePostModal() {
      const { value: content } = await Swal.fire({
        title: 'สร้างโพสต์ใหม่',
        input: 'textarea',
        inputPlaceholder: 'แบ่งปันความคิดเห็น การทำงาน หรือคำถามที่นี่...',
        showCancelButton: true,
        confirmButtonText: 'โพสต์เลย',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#4f46e5'
      });

      if (content) {
        Swal.showLoading();
        const res = await apiCall({
          action: 'createPost',
          courseId: currentCourse.courseId,
          userId: currentUser.userId,
          userName: currentUser.fullname,
          role: currentUser.role,
          content: content
        });
        Swal.close();

        if (res.success) {
          loadPosts();
        }
      }
    }

    // --- Edit & Delete Handlers ---
    async function openEditPostModal(postId, currentContent) {
      const { value: newContent } = await Swal.fire({
        title: 'แก้ไขโพสต์',
        input: 'textarea',
        inputValue: currentContent,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#4f46e5'
      });

      if (newContent && newContent !== currentContent) {
        Swal.showLoading();
        const res = await apiCall({
          action: 'editPost',
          postId: postId,
          userId: currentUser.userId,
          content: newContent
        });
        Swal.close();

        if (res.success) {
          loadPosts();
        } else {
          Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message });
        }
      }
    }

    async function confirmDeletePost(postId) {
      const result = await Swal.fire({
        title: 'ยืนยันการลบโพสต์?',
        text: 'การลบโพสต์จะลบความคิดเห็นทั้งหมดในโพสต์นี้ด้วย',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#6b7280',
        confirmButtonText: 'ลบโพสต์',
        cancelButtonText: 'ยกเลิก'
      });

      if (result.isConfirmed) {
        Swal.showLoading();
        const res = await apiCall({
          action: 'deletePost',
          postId: postId,
          userId: currentUser.userId
        });
        Swal.close();

        if (res.success) {
          loadPosts();
        } else {
          Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message });
        }
      }
    }

    async function openEditCommentModal(commentId, currentContent) {
      const { value: newContent } = await Swal.fire({
        title: 'แก้ไขความคิดเห็น',
        input: 'text',
        inputValue: currentContent,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        confirmButtonColor: '#4f46e5'
      });

      if (newContent && newContent !== currentContent) {
        Swal.showLoading();
        const res = await apiCall({
          action: 'editComment',
          commentId: commentId,
          userId: currentUser.userId,
          content: newContent
        });
        Swal.close();

        if (res.success) {
          loadPosts();
        } else {
          Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message });
        }
      }
    }

    async function confirmDeleteComment(commentId) {
      const result = await Swal.fire({
        title: 'ยืนยันการลบความคิดเห็น?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#6b7280',
        confirmButtonText: 'ลบ',
        cancelButtonText: 'ยกเลิก'
      });

      if (result.isConfirmed) {
        Swal.showLoading();
        const res = await apiCall({
          action: 'deleteComment',
          commentId: commentId,
          userId: currentUser.userId
        });
        Swal.close();

        if (res.success) {
          loadPosts();
        } else {
          Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: res.message });
        }
      }
    }

    async function submitComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      input.value = '';
      await apiCall({
        action: 'addComment',
        postId: postId,
        userId: currentUser.userId,
        userName: currentUser.fullname,
        content: content
      });

      loadPosts();
    }

    // --- QR Code Modal Logic ---
    function showQRCodeModal() {
      document.getElementById('qrCourseTitle').innerText = currentCourse.courseName;
      const qrcodeContainer = document.getElementById('qrcode');
      qrcodeContainer.innerHTML = '';

      const courseUrl = `${window.location.origin}${window.location.pathname}?courseId=${currentCourse.courseId}`;

      new QRCode(qrcodeContainer, {
        text: courseUrl,
        width: 180,
        height: 180
      });

      document.getElementById('qrModal').classList.remove('hidden');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.add('hidden');
    }

    // --- Helper Functions ---
    function showSection(sectionId) {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('boardSection').classList.add('hidden');

      document.getElementById(sectionId).classList.remove('hidden');
    }

    function navigateHome() {
      stopPolling();
      if (currentUser) {
        currentCourse = null;
        loadCourses();
      } else {
        showSection('authSection');
      }
    }
  </script>
</body>
</html>
