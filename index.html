<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUTEC Padlet Space</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .board-canvas { min-height: calc(100vh - 200px); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Top Navigation Bar -->
    <nav class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide cursor-pointer" onclick="checkAuthAndRedirect()">📌 MUTEC Padlet Space</h1>
            <div id="nav-actions" class="flex items-center gap-3">
                <!-- User Profile & Logout จะถูก Render ที่นี่ -->
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- VIEW 1: AUTHENTICATION (Login / Register Card) -->
        <div id="view-auth" class="max-w-md mx-auto my-10 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
            <!-- Tab Switch -->
            <div class="flex border-b border-slate-200 mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 pb-3 font-bold text-indigo-600 border-b-2 border-indigo-600">เข้าสู่ระบบ</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 pb-3 font-bold text-slate-400 border-b-2 border-transparent">สมัครสมาชิก</button>
            </div>

            <!-- Form: Login -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-600">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" id="login-username" required class="w-full mt-1 p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">รหัสผ่าน</label>
                    <input type="password" id="login-password" required class="w-full mt-1 p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">เข้าสู่ระบบ</button>
            </form>

            <!-- Form: Register -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="text-xs font-bold text-slate-600">ชื่อ-นามสกุล (สำหรับแสดงบนบอร์ด)</label>
                    <input type="text" id="reg-fullName" required class="w-full mt-1 p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">บทบาทผู้ใช้งาน</label>
                    <select id="reg-role" class="w-full mt-1 p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="student">นักเรียน / นักศึกษา</option>
                        <option value="teacher">ครู / อาจารย์ผู้สอน</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" id="reg-username" required class="w-full mt-1 p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600">รหัสผ่าน</label>
                    <input type="password" id="reg-password" required class="w-full mt-1 p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md">สมัครสมาชิก</button>
            </form>
        </div>

        <!-- VIEW 2: DASHBOARD (หน้าแรกหลังล็อกอิน) -->
        <div id="view-dashboard" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-900">ยินดีต้อนรับสู่ระบบกระดานเรียนรู้</h2>
                    <p class="text-slate-500">เลือกเข้าสู่ห้องเรียนด้วยรหัสห้อง หรือสร้างห้องเรียนใหม่เพื่อเริ่มสอน</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button id="btn-create-room" onclick="popupCreateRoom()" class="flex-1 md:flex-initial bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl transition shadow-sm hidden">
                        ➕ สร้างห้องเรียนใหม่ (สำหรับครู)
                    </button>
                    <button onclick="popupJoinRoom()" class="flex-1 md:flex-initial bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl transition shadow-sm">
                        🔑 ใส่รหัสเข้าห้อง
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW 3: PADLET BOARD ROOM (หน้ากระดานกิจกรรมย่อย) -->
        <div id="view-board" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span id="board-teacher" class="text-xs font-semibold uppercase tracking-wider bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md">Teacher</span>
                    <h2 id="board-title" class="text-3xl font-bold text-slate-900 mt-2">ชื่อห้องเรียน</h2>
                    <p id="board-desc" class="text-slate-500 mt-1">รายละเอียดวิชาหรือกิจกรรม</p>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="popupShareQR()" class="flex-1 md:flex-initial bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-4 py-2.5 rounded-xl transition flex items-center justify-center gap-2">
                        📱 QR Code แชร์ห้อง
                    </button>
                    <button onclick="popupCreatePost()" class="flex-1 md:flex-initial bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl transition shadow-md">
                        📌 เขียนโพสต์ใหม่
                    </button>
                </div>
            </div>

            <!-- โซนการ์ดโพสต์ -->
            <div id="board-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 board-canvas items-start">
            </div>
        </div>

    </main>

    <script>
        // Web App URL API ที่ฝังเรียบร้อยแล้ว
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNxQRAsrm2LFx0KsfX-oUaz8rUSya58R-BZTnUOQOt03YreyvPKT5DtEwWVk6e6xivBA/exec";
        
        let currentUser = null;
        let currentRoomId = "";
        let refreshInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('padlet_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
            }
            checkAuthAndRedirect();
        });

        function checkAuthAndRedirect() {
            if (!currentUser) {
                showView('auth');
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const rId = urlParams.get('room');
            if (rId) {
                openRoom(rId);
            } else {
                showDashboard();
            }
        }

        function showView(viewName) {
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-board').classList.add('hidden');

            if (refreshInterval) clearInterval(refreshInterval);

            if (viewName === 'auth') {
                document.getElementById('view-auth').classList.remove('hidden');
                renderNav();
            } else if (viewName === 'dashboard') {
                document.getElementById('view-dashboard').classList.remove('hidden');
                renderNav();
            } else if (viewName === 'board') {
                document.getElementById('view-board').classList.remove('hidden');
                renderNav();
            }
        }

        function renderNav() {
            const navActions = document.getElementById('nav-actions');
            if (!currentUser) {
                navActions.innerHTML = '';
                return;
            }

            const roleBadge = currentUser.role === 'teacher' ? '👨‍🏫 ครูผู้สอน' : '👨‍🎓 นักเรียน';
            navActions.innerHTML = `
                <div class="text-right hidden sm:block">
                    <div class="text-sm font-bold">${currentUser.fullName}</div>
                    <div class="text-[10px] text-indigo-200">${roleBadge}</div>
                </div>
                <button onclick="handleLogout()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg transition">ออกจากระบบ</button>
            `;

            const btnCreateRoom = document.getElementById('btn-create-room');
            if (btnCreateRoom) {
                if (currentUser.role === 'teacher') btnCreateRoom.classList.remove('hidden');
                else btnCreateRoom.classList.add('hidden');
            }
        }

        // --- AUTHENTICATION HANDLERS ---
        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('form-login').classList.remove('hidden');
                document.getElementById('form-register').classList.add('hidden');
                document.getElementById('tab-login').className = "flex-1 pb-3 font-bold text-indigo-600 border-b-2 border-indigo-600";
                document.getElementById('tab-register').className = "flex-1 pb-3 font-bold text-slate-400 border-b-2 border-transparent";
            } else {
                document.getElementById('form-login').classList.add('hidden');
                document.getElementById('form-register').classList.remove('hidden');
                document.getElementById('tab-register').className = "flex-1 pb-3 font-bold text-indigo-600 border-b-2 border-indigo-600";
                document.getElementById('tab-login').className = "flex-1 pb-3 font-bold text-slate-400 border-b-2 border-transparent";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            Swal.fire({ title: 'กำลังตรวจสอบข้อมูล...', didOpen: () => Swal.showLoading() });

            const payload = {
                action: 'login',
                username: document.getElementById('login-username').value.trim(),
                password: document.getElementById('login-password').value.trim()
            };

            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
                Swal.close();

                if (res.success) {
                    currentUser = res.user;
                    localStorage.setItem('padlet_user', JSON.stringify(currentUser));
                    checkAuthAndRedirect();
                } else {
                    Swal.fire('เข้าสู่ระบบไม่สำเร็จ', res.message, 'error');
                }
            } catch (err) {
                Swal.fire('เชื่อมต่อล้มเหลว', 'ไม่สามารถเชื่อมต่อ Server ได้', 'error');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            Swal.fire({ title: 'กำลังสมัครสมาชิก...', didOpen: () => Swal.showLoading() });

            const payload = {
                action: 'register',
                fullName: document.getElementById('reg-fullName').value.trim(),
                role: document.getElementById('reg-role').value,
                username: document.getElementById('reg-username').value.trim(),
                password: document.getElementById('reg-password').value.trim()
            };

            try {
                const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
                Swal.close();

                if (res.success) {
                    currentUser = res.user;
                    localStorage.setItem('padlet_user', JSON.stringify(currentUser));
                    Swal.fire('สำเร็จ', 'สมัครสมาชิกเรียบร้อยแล้ว', 'success').then(() => checkAuthAndRedirect());
                } else {
                    Swal.fire('สมัครไม่สำเร็จ', res.message, 'error');
                }
            } catch (err) {
                Swal.fire('เชื่อมต่อล้มเหลว', 'ไม่สามารถเชื่อมต่อ Server ได้', 'error');
            }
        }

        function handleLogout() {
            localStorage.removeItem('padlet_user');
            currentUser = null;
            window.history.pushState({}, '', window.location.pathname);
            showView('auth');
        }

        function showDashboard() {
            currentRoomId = "";
            window.history.pushState({}, '', window.location.pathname);
            showView('dashboard');
        }

        // --- BOARD ROOM HANDLERS ---
        async function openRoom(roomId) {
            if (!currentUser) return showView('auth');

            currentRoomId = roomId;
            Swal.fire({ title: 'กำลังเข้าสู่ห้องเรียน...', didOpen: () => Swal.showLoading() });

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getRoomDetails", roomId: roomId })
                }).then(r => r.json());
                
                Swal.close();

                if (res.success) {
                    window.history.pushState({}, '', `?room=${roomId}`);
                    showView('board');

                    document.getElementById('board-title').innerText = res.room.roomName;
                    document.getElementById('board-desc').innerText = res.room.description;
                    document.getElementById('board-teacher').innerText = `ผู้สอน: ${res.room.teacherName}`;

                    renderPosts(res.posts);
                    
                    if (!refreshInterval) {
                        refreshInterval = setInterval(loadBoardDataOnly, 10000);
                    }
                } else {
                    Swal.fire('ข้อผิดพลาด', res.message, 'error').then(() => showDashboard());
                }
            } catch (error) {
                Swal.fire('เชื่อมต่อล้มเหลว', 'ไม่สามารถเชื่อมต่อ Server ได้', 'error');
            }
        }

        async function loadBoardDataOnly() {
            if (!currentRoomId || !currentUser) return;
            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "getRoomDetails", roomId: currentRoomId })
                }).then(r => r.json());
                if (res.success) renderPosts(res.posts);
            } catch (e) { console.log("Silent refresh error"); }
        }

        function renderPosts(posts) {
            const container = document.getElementById('board-posts-container');
            container.innerHTML = '';

            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400">
                        ยังไม่มีโพสต์ในห้องนี้ กดปุ่ม "เขียนโพสต์ใหม่" เพื่อเริ่มระดมสมองกันเลย!
                    </div>
                `;
                return;
            }

            posts.forEach(post => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between";
                card.style.borderTop = `6px solid ${post.color || '#6366f1'}`;

                let commentsHtml = '';
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach(c => {
                        commentsHtml += `
                            <div class="bg-slate-50 p-2.5 rounded-xl text-xs border border-slate-100">
                                <span class="font-bold text-slate-700">${c.author}:</span>
                                <p class="text-slate-600 mt-0.5">${c.content}</p>
                            </div>
                        `;
                    });
                } else {
                    commentsHtml = `<p class="text-center text-xs text-slate-400 py-2">ยังไม่มีข้อเสนอแนะ</p>`;
                }

                card.innerHTML = `
                    <div class="p-5 space-y-3">
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full">${post.author}</span>
                            <span class="text-[10px] text-slate-400">${new Date(post.createdAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</span>
                        </div>
                        <p class="text-slate-800 text-sm whitespace-pre-wrap font-medium">${post.content}</p>
                        
                        <hr class="border-slate-100">
                        
                        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                            <h4 class="text-xs font-bold text-slate-500">💬 ความคิดเห็น (${post.comments ? post.comments.length : 0})</h4>
                            ${commentsHtml}
                        </div>
                    </div>

                    <div class="p-3 bg-slate-50 border-t border-slate-100 flex gap-1.5">
                        <input type="text" id="input-com-${post.postId}" placeholder="พิมพ์ตอบกลับ..." class="w-full text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <button onclick="submitComment('${post.postId}')" class="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-indigo-700 transition">ส่ง</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- POPUPS (SweetAlert2) ---
        function popupCreateRoom() {
            Swal.fire({
                title: '🏫 สร้างบอร์ดห้องเรียนใหม่',
                html: `
                    <input id="swal-roomName" class="swal2-input" placeholder="ชื่อวิชา / กิจกรรม">
                    <input id="swal-desc" class="swal2-input" placeholder="คำอธิบายหรือคำชี้แจงย่อย">
                `,
                focusConfirm: false,
                confirmButtonText: 'สร้างห้องเรียน',
                showCancelButton: true,
                preConfirm: () => {
                    return {
                        roomName: document.getElementById('swal-roomName').value.trim(),
                        description: document.getElementById('swal-desc').value.trim()
                    }
                }
            }).then(async (result) => {
                if (result.isConfirmed && result.value.roomName) {
                    Swal.fire({ title: 'กำลังสร้างห้อง...', didOpen: () => Swal.showLoading() });
                    const res = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ 
                            action: "createRoom", 
                            ...result.value,
                            teacherName: currentUser.fullName,
                            teacherId: currentUser.userId
                        })
                    }).then(r => r.json());
                    
                    if (res.success) {
                        Swal.fire('สำเร็จ!', 'สร้างห้องเรียนเรียนร้อยแล้ว', 'success').then(() => openRoom(res.roomId));
                    }
                }
            });
        }

        function popupJoinRoom() {
            Swal.fire({
                title: '🔑 เข้าสู่ห้องเรียน',
                input: 'text',
                inputPlaceholder: 'วางรหัสห้องเรียน (เช่น ROOM_xxxx)',
                showCancelButton: true,
                confirmButtonText: 'เข้าห้อง'
            }).then((res) => {
                if (res.isConfirmed && res.value.trim()) openRoom(res.value.trim());
            });
        }

        function popupCreatePost() {
            Swal.fire({
                title: '📌 สร้างโพสต์หรือการ์ดคำถาม',
                html: `
                    <textarea id="swal-content" class="swal2-input h-24" placeholder="พิมพ์ข้อความคำถามหรือแชร์ไอเดีย..."></textarea>
                    <div class="mt-3 flex items-center justify-center gap-3">
                        <label class="text-xs font-bold text-slate-500">สีขอบการ์ด:</label>
                        <input type="color" id="swal-color" value="#6366f1" class="w-10 h-8 rounded border cursor-pointer">
                    </div>
                `,
                focusConfirm: false,
                confirmButtonText: 'แปะบอร์ด',
                showCancelButton: true,
                preConfirm: () => {
                    return {
                        content: document.getElementById('swal-content').value.trim(),
                        color: document.getElementById('swal-color').value
                    }
                }
            }).then(async (result) => {
                if (result.isConfirmed && result.value.content) {
                    const res = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ 
                            action: "createPost", 
                            roomId: currentRoomId, 
                            author: currentUser.fullName,
                            authorId: currentUser.userId,
                            ...result.value 
                        })
                    }).then(r => r.json());
                    
                    if (res.success) loadBoardDataOnly();
                }
            });
        }

        async function submitComment(postId) {
            const input = document.getElementById(`input-com-${postId}`);
            const content = input.value.trim();
            if (!content) return;

            input.value = '';
            const res = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "createComment", 
                    postId: postId, 
                    author: currentUser.fullName,
                    authorId: currentUser.userId,
                    content: content 
                })
            }).then(r => r.json());

            if (res.success) loadBoardDataOnly();
        }

        function popupShareQR() {
            const currentUrl = window.location.href;
            Swal.fire({
                title: '📱 สแกนเข้าร่วมห้องเรียนนี้',
                html: `
                    <div class="flex flex-col items-center justify-center space-y-4">
                        <div id="qrcode-area" class="p-2 bg-white inline-block"></div>
                        <p class="text-xs text-slate-500 font-mono break-all bg-slate-100 p-2 rounded-lg w-full">รหัสห้อง: ${currentRoomId}</p>
                    </div>
                `,
                didOpen: () => {
                    new QRCode(document.getElementById("qrcode-area"), {
                        text: currentUrl,
                        width: 200,
                        height: 200,
                        colorDark : "#1e1b4b",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });
                }
            });
        }
    </script>
</body>
</html>
